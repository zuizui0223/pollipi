[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pollipi-analysis"
version = "0.1.0"
description = "Pure PolliPi mesh analysis, simulation, and interval policy"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
