[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visit-monitor-coordinator"
version = "0.1.0"
description = "Coordinator API for managing PolliPi field devices"
requires-python = ">=3.11"
dependencies = [
  "aenum>=3.1,<4",
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-yaml>=1.4,<2",
  "python-dotenv>=1,<2",
  "python-jose>=3.3,<4",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy[asyncio]>=2,<3",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
py-modules = ["base", "config", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["constants", "devices", "orchestration", "sessions", "user", "utils"]
exclude = ["tests", "wwwroot"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
