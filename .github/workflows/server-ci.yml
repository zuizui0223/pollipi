name: Server/Web CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "packages/server/**"
      - "packages/web/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "packages/server/**"
      - "packages/web/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:
    inputs:
      run_pi_smoke:
        description: "Run the optional self-hosted Raspberry Pi smoke test"
        required: false
        type: boolean
        default: false
      real_camera_smoke:
        description: "Require a physical Camera Module and validate real-camera TNOA Phase-A output"
        required: false
        type: boolean
        default: false
      pi_target:
        description: "SSH target for Pi deployment (user@host), leave blank to skip"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: packages/server/pyproject.toml

      - name: Install server package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/analysis[dev]"
          pip install -e "packages/server[dev]" || pip install -e "packages/server"
          pip install pytest pytest-asyncio httpx

      - name: Compile-check all server Python files
        run: |
          find packages/server/src -name "*.py" -print0 | xargs -0 python -m py_compile
          find packages/analysis/src -name "*.py" -print0 | xargs -0 python -m py_compile

      - name: Run analysis pytest
        run: pytest packages/analysis/ -v --tb=short

      - name: Run pytest (fake camera)
        env:
          POLLIPI_FAKE_CAMERA: "1"
        run: pytest packages/server/ -v --tb=short

      - name: Create dist directory
        run: mkdir -p dist

      - name: Bundle pollipi_api_server.py
        run: |
          python -m visit_monitor_server.distribution.bundle_single_file \
            --output dist/pollipi_api_server.py

      - name: Verify bundle compiles cleanly
        run: python -m py_compile dist/pollipi_api_server.py

      - name: Smoke-test bundled server with fake camera
        env:
          POLLIPI_FAKE_CAMERA: "1"
        run: |
          export POLLIPI_IMAGE_DIR="$(mktemp -d)"
          python - <<'PY'
          import importlib.util
          import time
          from pathlib import Path
          from fastapi.testclient import TestClient

          bundle = Path("dist/pollipi_api_server.py").resolve()
          spec = importlib.util.spec_from_file_location("pollipi_api_server", bundle)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          with TestClient(module.app) as client:
              assert client.get("/device").status_code == 200
              assert client.get("/status").status_code == 200
              assert client.post("/start", json={"interval_sec": 1}).status_code == 200
              deadline = time.monotonic() + 5
              image_count = 0
              while time.monotonic() < deadline:
                  response = client.get("/images")
                  assert response.status_code == 200
                  image_count = response.json()["image_count"]
                  if image_count:
                      break
                  time.sleep(0.2)
              assert image_count >= 1
              assert client.post("/stop").status_code == 200
          PY

      - name: Bundle file info
        run: |
          wc -l dist/pollipi_api_server.py
          ls -lh dist/pollipi_api_server.py

      - name: Upload pollipi_api_server.py artifact
        uses: actions/upload-artifact@v4
        with:
          name: pollipi-api-server
          path: dist/pollipi_api_server.py
          retention-days: 30
          if-no-files-found: error

  web:
    name: Web Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web type check
        run: pnpm check:web

      - name: Build web app
        run: pnpm build:web

  pi-smoke:
    name: Pi Smoke Test (arm64)
    needs: ci
    if: github.event_name == 'workflow_dispatch' && inputs.run_pi_smoke
    runs-on: [self-hosted, linux, arm64, raspberry-pi]
    timeout-minutes: 10

    env:
      SERVER_PORT: "8765"
      SERVER_HOST: "127.0.0.1"
      BUNDLE_PATH: "dist/pollipi_api_server.py"
      POLLIPI_PROBE_INTERVAL_SEC: "1"
      POLLIPI_LIVE_ADAPTIVE_ENABLED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pollipi_api_server.py artifact
        uses: actions/download-artifact@v4
        with:
          name: pollipi-api-server
          path: dist/

      - name: Confirm artifact present
        run: ls -lh dist/pollipi_api_server.py

      - name: Require physical camera for real-camera smoke
        if: inputs.real_camera_smoke
        run: |
          if systemctl is-active --quiet pollipi.service 2>/dev/null; then
            echo "pollipi.service is active and may own the camera; refusing to stop a live service automatically."
            echo "Stop the service intentionally, then rerun this manual smoke."
            exit 2
          fi
          python3 - <<'PY'
          from picamera2 import Picamera2
          info = Picamera2.global_camera_info()
          if not info:
              raise SystemExit("No Raspberry Pi camera detected")
          print("Detected camera(s):", info)
          PY

      - name: Report fake-camera smoke mode
        if: ${{ !inputs.real_camera_smoke }}
        run: echo "Running self-hosted Pi smoke with FakeCamera; set real_camera_smoke=true for physical sensor validation."

      - name: Install/verify uvicorn
        run: pip3 install --quiet "uvicorn[standard]>=0.30,<1.0"

      - name: Prepare image directory
        run: |
          IMAGE_DIR=$(mktemp -d)
          echo "POLLIPI_IMAGE_DIR=$IMAGE_DIR" >> "$GITHUB_ENV"
          echo "IMAGE_DIR=$IMAGE_DIR" >> "$GITHUB_ENV"
          echo "Image dir: $IMAGE_DIR"

      - name: Start uvicorn server
        env:
          POLLIPI_FAKE_CAMERA: ${{ inputs.real_camera_smoke && '0' || '1' }}
        run: |
          uvicorn --app-dir dist pollipi_api_server:app \
            --host "$SERVER_HOST" \
            --port "$SERVER_PORT" \
            --log-level info \
            > /tmp/pollipi_server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://${SERVER_HOST}:${SERVER_PORT}/device" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pollipi_server.log || true
          exit 1

      - name: "Smoke: GET /device"
        run: curl -sf "http://${SERVER_HOST}:${SERVER_PORT}/device" | python3 -m json.tool

      - name: "Smoke: GET /status"
        run: curl -sf "http://${SERVER_HOST}:${SERVER_PORT}/status" | python3 -m json.tool

      - name: "Smoke: POST /start"
        run: |
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d '{"interval_sec":5,"site_id":"pi-smoke-site","flower_id":"pi-smoke-flower","comparison_session_id":"tnoa-real-pi-smoke","camera_role":"primary","method_mode":"plain"}' \
            "http://${SERVER_HOST}:${SERVER_PORT}/start" | python3 -m json.tool

      - name: Wait for multiple physical or fake probes
        run: sleep 8

      - name: "Smoke: GET /images"
        run: curl -sf "http://${SERVER_HOST}:${SERVER_PORT}/images" | python3 -m json.tool

      - name: "Smoke: POST /stop"
        run: curl -sf -X POST "http://${SERVER_HOST}:${SERVER_PORT}/stop" | python3 -m json.tool

      - name: Validate TNOA Phase-A smoke record
        run: |
          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          image_dir = Path(os.environ["IMAGE_DIR"])
          files = sorted(image_dir.glob("tnoa_observation_v1_*.csv"))
          assert len(files) == 1, f"expected one TNOA log, found {len(files)}: {files}"
          with files[0].open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) >= 3, f"expected >=3 probe rows, got {len(rows)}"

          for row in rows:
              assert row["log_schema_version"] == "tnoa-observation-log-1"
              assert row["schema_version"] == "tnoa-shadow-1"
              assert row["calibration_status"] == "unavailable"
              assert row["observation_state"] == "U"
              assert row["would_be_action"] == "observe_only"
              assert row["action_applied"] == "False"
              assert row["target_calibrated_support"] == ""
              assert row["nuisance_calibrated_support"] == ""
              assert row["observability_calibrated_support"] == ""
              assert row["coupled_calibrated_support"] == ""
              assert row["absence_calibrated_support"] == ""
              assert row["coupled_available"] == "False"
              assert row["absence_available"] == "False"
              assert row["site_id"] == "pi-smoke-site"
              assert row["flower_id"] == "pi-smoke-flower"
              assert row["comparison_session_id"] == "tnoa-real-pi-smoke"
              assert row["camera_role"] == "primary"
              assert row["method_mode"] == "plain"
              assert row["observability_frame_available"] == "True"

          timed = [r for r in rows if r["observability_actual_probe_interval_sec"]]
          assert timed, "no measured probe interval was recorded"
          print(f"TNOA Pi smoke OK: {len(rows)} rows, fail-closed U/observe_only, file={files[0].name}")
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-server-logs
          path: /tmp/pollipi_server.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Pi smoke record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-tnoa-smoke-record
          path: ${{ env.IMAGE_DIR }}/
          retention-days: 7
          if-no-files-found: ignore

  cd:
    name: Deploy
    needs: ci
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pollipi_api_server.py artifact
        uses: actions/download-artifact@v4
        with:
          name: pollipi-api-server
          path: dist/

      - name: Confirm artifact present
        run: ls -lh dist/pollipi_api_server.py

      - name: Create or update GitHub Release (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build - ${{ github.sha }}"
          body: |
            Automated build from commit ${{ github.sha }}.

            Download `pollipi_api_server.py` and copy it to your Raspberry Pi,
            then run:
            ```bash
            uvicorn pollipi_api_server:app --host 0.0.0.0 --port 8000
            ```
          files: dist/pollipi_api_server.py
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Pi SSH target
        id: pi-target
        run: |
          TARGET="${{ github.event.inputs.pi_target }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ secrets.PI_SSH_TARGET }}"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ -n "$TARGET" ]; then
            echo "Pi target: $TARGET"
          else
            echo "No Pi target configured - skipping SSH deploy."
          fi

      - name: Deploy to Raspberry Pi via SSH
        if: steps.pi-target.outputs.target != ''
        env:
          PI_TARGET: ${{ steps.pi-target.outputs.target }}
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_DEPLOY_PATH: ${{ secrets.PI_DEPLOY_PATH || '/home/pi/pollipi' }}
        run: |
          mkdir -p ~/.ssh
          echo "$PI_SSH_KEY" > ~/.ssh/pi_deploy_key
          chmod 600 ~/.ssh/pi_deploy_key
          SSH_OPTS="-i ~/.ssh/pi_deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes"
          ssh $SSH_OPTS "$PI_TARGET" "mkdir -p '$PI_DEPLOY_PATH'"
          scp $SSH_OPTS dist/pollipi_api_server.py "${PI_TARGET}:${PI_DEPLOY_PATH}/pollipi_api_server.py"
          ssh $SSH_OPTS "$PI_TARGET" \
            "sudo systemctl restart pollipi.service 2>/dev/null || echo 'systemd service not found - manual restart required'"
