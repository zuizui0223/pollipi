name: Analysis CI

on:
  pull_request:
    paths:
      - "packages/analysis/**"
      - ".github/workflows/analysis-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/analysis/**"
      - ".github/workflows/analysis-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis package
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/analysis[dev]"
      - name: Compile analysis package
        run: python -m compileall -q packages/analysis/src
      - name: Run analysis tests
        run: pytest packages/analysis/ -q
      - name: Print V2 visual benchmark ledger
        run: |
          python - <<'PY'
          from pollipi_analysis.simulation.portable_visual_v2 import suite_fingerprint
          from pollipi_analysis.simulation.visual_contradiction_v2 import run_visual_contradiction_v2
          print("portable_visual_v2_sha256", suite_fingerprint())
          for row in run_visual_contradiction_v2():
              print(row.scenario_id, row.true_visit, row.pollipi_state, row.pollipi_reason,
                    f"active={row.active_cell_proportion:.4f}",
                    f"global={row.global_synchrony:.4f}",
                    f"shift={row.estimated_global_shift:.3f}")
          PY
