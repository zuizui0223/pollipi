name: PolliPi analysis CI

on:
  pull_request:
    paths:
      - "packages/analysis/**"
      - ".github/workflows/analysis-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/analysis/**"
      - ".github/workflows/analysis-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install analysis package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/analysis[dev]"
          pip install pytest
      - name: Compile analysis package
        run: find packages/analysis/src -name "*.py" -print0 | xargs -0 python -m py_compile
      - name: Run analysis tests
        run: pytest packages/analysis/ -q
